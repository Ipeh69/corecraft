name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create production .env
        run: |
          if [ -z "$PROD_ENV" ]; then
            echo "PROD_ENV is not set (add it as a repository secret or variable)." >&2
            exit 1
          fi
          printf '%s\n' "$PROD_ENV" > .env
        env:
          PROD_ENV: ${{ secrets.PROD_ENV || vars.PROD_ENV }}

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          port: 21
          protocol: ftp
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .env.example
            .env.production
            Ipeh/**
            *.zip
            *.sql
            README.md
