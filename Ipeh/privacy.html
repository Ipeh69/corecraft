<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy | CoreCraft</title>
  <style>
    :root {
      --bg:#0a0c10; --bg2:#1c2030; --border:#2a2f3e; --text:#f0f2f8; --muted:#8892a4; --cyan:#00e5ff; --purple:#7c3aed;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .page{width:100%;max-width:900px;padding:24px}
    .card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:32px;min-height:60vh;display:flex;flex-direction:column;justify-content:center}
    h1{font-size:32px;margin-bottom:12px;color:var(--cyan)}
    p{color:var(--muted);margin-bottom:12px}
    a{color:var(--cyan);text-decoration:none}
    a:hover{color:white}
    .btn{display:inline-block;margin-top:16px;padding:8px 12px;border-radius:999px;background:transparent;border:1px solid rgba(255,255,255,.15);color:var(--muted);font-weight:500;font-size:13px;transition:all .2s;align-self:flex-start}
    .btn:hover{color:var(--text);border-color:var(--cyan);background:rgba(255,255,255,.04)}
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>Privacy Policy</h1>
      <p>CoreCraft respects your privacy and only uses your information to provide a better experience on the site.</p>
      <p>We do not sell your personal data. Any information collected is used for account support, analytics, and service improvement.</p>
      <a class="btn" href="Ipeh.html">Back to Home</a>
    </div>
  </div>
</body>
</html>
